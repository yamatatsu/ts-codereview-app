name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Node は package.json の engines.node、pnpm は packageManager から Vite+ が選ぶ
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Check (format / lint / type check)
        run: vp check
      - name: Test (core)
        run: vp -C packages/core test
      - name: Test (desktop renderer logic)
        run: vp -C apps/desktop test
